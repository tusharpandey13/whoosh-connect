[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whoosh-connect"
version = "0.1.0"
description = "Bridge Zwift Click v2 controllers to MyWhoosh over OpenBikeControl"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["bleak>=0.22", "zeroconf>=0.130", "psutil>=5.9", "platformdirs>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
bundle = ["pyinstaller>=6.10"]

[project.scripts]
whoosh-connect = "whoosh_connect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
